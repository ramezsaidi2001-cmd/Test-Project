<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f7f8fa;font-family:Arial,Helvetica,sans-serif;color:#111827">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px">
      <p style="margin:0 0 24px;font-weight:bold;font-size:18px">Fleetly</p>
      <h1 style="margin:0 0 12px;font-size:20px">Confirmez votre adresse e-mail</h1>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#374151">
        Merci de vous être inscrit sur Fleetly. Cliquez sur le bouton ci-dessous pour confirmer votre adresse e-mail
        et configurer votre agence.
      </p>
      <a
        href="{{ .ConfirmationURL }}"
        style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;font-weight:bold"
        >Confirmer mon e-mail</a
      >
      <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#6b7280">
        Si vous n'êtes pas à l'origine de cette inscription, vous pouvez ignorer cet e-mail.
      </p>
    </div>
  </body>
</html>
